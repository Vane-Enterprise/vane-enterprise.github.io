[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vane-enterprise"
version = "0.1.0"
description = "Vane Enterprise official repository"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Vane Enterprise", email = "info@vane-enterprise.com"}
]
license = {text = "MIT"}

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "flake8>=5.0",
    "black>=22.0",
    "mypy>=0.990",
    "pylint>=2.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=html --cov-report=term-missing"
python_files = "test_*.py"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pylint.messages_control]
disable = ["C0111", "R0913"]

[tool.pylint.format]
max-line-length = 100
