name: "Code Quality and Coverage"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 0' # Runs weekly on Sundays

jobs:
  analyze-and-test:
    name: Code Quality & Python Coverage
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install project + dev extras from pyproject.toml (pytest, pytest-cov, etc.)
          pip install -e ".[dev]"

      - name: Run Python tests with coverage
        run: |
          # Explicit, valid pytest-cov options. Produces terminal, xml and html reports.
          pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-report=html

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.xml
            htmlcov

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: 'python'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
